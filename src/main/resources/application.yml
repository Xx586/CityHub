server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: cityhub-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cityhub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USER:cityhub}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: cityhub-voucher-order
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.cityhub.domain.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

cityhub:
  upload-dir: ${UPLOAD_DIR:./uploads}
  auth:
    token-ttl: 30m
    code-ttl: 2m
  cache:
    mode: ${CACHE_MODE:multilevel}
  kafka:
    order-topic: cityhub.voucher-order.created.v1
    order-dlt-topic: cityhub.voucher-order.created.v1.dlt
  order:
    unpaid-timeout: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    com.cityhub: info
