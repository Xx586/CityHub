<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">CityHub project banner</title>
  <desc id="desc">CityHub high concurrency cache, seckill system and engineering governance architecture</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="0.55" stop-color="#0b2850"/>
      <stop offset="1" stop-color="#123d56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52e5ff"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8cc9df" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1230" cy="70" r="170" fill="#5ad8ff" opacity=".08"/>
  <circle cx="120" cy="420" r="210" fill="#836dff" opacity=".08"/>

  <g transform="translate(88 68)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#accent)"/>
    <path d="M22 22h28v8H30v20h20v8H22z" fill="#07152f"/>
    <circle cx="50" cy="40" r="5" fill="#07152f"/>
    <text x="94" y="49" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="750">CityHub</text>
    <text x="0" y="112" fill="#b9d8e9" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">面向高并发场景的本地生活服务后端</text>
    <rect x="0" y="137" width="510" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <path d="M350 255H700M700 255h350" stroke="#56dfff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="7 8"/>
    <circle cx="700" cy="255" r="8" fill="#6de3ff" filter="url(#glow)"/>

    <g transform="translate(82 225)">
      <rect width="350" height="150" rx="22" fill="#0d2748" stroke="#45d9fa" stroke-opacity=".65"/>
      <circle cx="45" cy="43" r="18" fill="#45d9fa" opacity=".2"/>
      <path d="M35 43h20M45 33v20" stroke="#62e5ff" stroke-width="3"/>
      <text x="76" y="49" fill="#f6fbff" font-size="24" font-weight="700">HIGH-CONCURRENCY CACHE</text>
      <text x="30" y="91" fill="#8fd9e9" font-size="18">Caffeine → Redis → MySQL</text>
      <text x="30" y="122" fill="#a9bed1" font-size="16">logical expiry · hot key · consistency</text>
    </g>

    <g transform="translate(525 225)">
      <rect width="350" height="150" rx="22" fill="#14244d" stroke="#8877ff" stroke-opacity=".75"/>
      <circle cx="45" cy="43" r="18" fill="#8877ff" opacity=".22"/>
      <path d="M36 46l8-15 3 11h9L43 58l-2-12z" fill="#a79cff"/>
      <text x="76" y="49" fill="#f6fbff" font-size="24" font-weight="700">SECKILL PIPELINE</text>
      <text x="30" y="91" fill="#b7aefc" font-size="18">Redis + Lua → Outbox → Kafka</text>
      <text x="30" y="122" fill="#a9bed1" font-size="16">atomic admission · idempotency · DLT</text>
    </g>

    <g transform="translate(968 225)">
      <rect width="350" height="150" rx="22" fill="#0d3045" stroke="#57e0b4" stroke-opacity=".7"/>
      <circle cx="45" cy="43" r="18" fill="#57e0b4" opacity=".2"/>
      <path d="M36 44l7 7 13-16" fill="none" stroke="#6af0c2" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="49" fill="#f6fbff" font-size="24" font-weight="700">ENGINEERING</text>
      <text x="30" y="91" fill="#8de5c7" font-size="18">Rate Limit · State Machine · CI</text>
      <text x="30" y="122" fill="#a9bed1" font-size="16">observability · tests · benchmark</text>
    </g>
  </g>
</svg>
